<!-- 保護者用 予約画面 -->
<style>
  :root {
    --line: #dadce0;
    --ink: #202124;
    --sub: #5f6368;
    --accent: #1a73e8;
    --ok: #188038;
    --okbg: #e6f4ea;
    --warnbg: #fef7e0;
    --errbg: #fce8e6;
    --err: #c5221f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 12px 64px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--ink); background: #f6f7f9; line-height: 1.7;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 20px 0 4px; }
  .notice { white-space: pre-wrap; color: var(--sub); font-size: .93rem; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 1.02rem; margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; }
  .tabs button {
    flex: 1; padding: 11px 8px; border: 1px solid var(--line); background: #fff;
    border-radius: 999px; font-size: .95rem; cursor: pointer; color: var(--sub);
  }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  label { display: block; font-size: .87rem; color: var(--sub); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 11px; font-size: 1rem; border: 1px solid var(--line);
    border-radius: 8px; font-family: inherit; background: #fff; color: var(--ink);
  }
  textarea { min-height: 72px; resize: vertical; }
  button.primary {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem; font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button.ghost {
    width: 100%; margin-top: 10px; padding: 12px; font-size: .95rem;
    background: #fff; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .day { margin-bottom: 18px; }
  .day h3 { font-size: .98rem; margin: 0 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--line); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot {
    padding: 13px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--okbg);
    font-size: .95rem; cursor: pointer; text-align: center; color: var(--ink);
  }
  .slot.full { background: #f1f3f4; color: #9aa0a6; cursor: default; text-decoration: line-through; }
  .slot.mine { background: #fff; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
  .slot.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .msg { padding: 12px; border-radius: 8px; font-size: .92rem; margin-bottom: 12px; white-space: pre-wrap; }
  .msg.err { background: var(--errbg); color: var(--err); }
  .msg.warn { background: var(--warnbg); }
  .msg.ok { background: var(--okbg); color: var(--ok); }
  .code { font-size: 2.4rem; font-weight: 700; letter-spacing: .32em; text-align: center;
          padding: 14px; background: var(--okbg); border-radius: 10px; margin: 12px 0; }
  .kv { display: grid; grid-template-columns: 6.5em 1fr; row-gap: 6px; font-size: .95rem; }
  .kv dt { color: var(--sub); }
  .kv dd { margin: 0; font-weight: 600; }
  .hide { display: none; }
  .spin { text-align: center; color: var(--sub); padding: 20px; font-size: .9rem; }
  @media print { .tabs, button, .notice { display: none !important; } body { background: #fff; } }
</style>

<div class="wrap">
  <h1 id="title">読み込み中…</h1>
  <div class="notice" id="notice"></div>
  <div id="closed" class="msg warn hide"></div>

  <div class="tabs">
    <button id="tabBook" class="on" onclick="showTab('book')">予約する</button>
    <button id="tabManage" onclick="showTab('manage')">確認・変更・取消</button>
  </div>

  <!-- ========== 予約する ========== -->
  <div id="paneBook">
    <div class="card" id="stepId">
      <h2>1. お子さんの情報を入力</h2>
      <div id="idErr"></div>
      <label for="cls">クラス</label>
      <select id="cls"></select>
      <label for="no">出席番号</label>
      <input id="no" type="number" inputmode="numeric" min="1" placeholder="例: 12">
      <label for="name">生徒氏名</label>
      <input id="name" type="text" placeholder="例: 長崎 太郎">
      <button class="primary" id="btnFind" onclick="findSlots()">空いている時間を見る</button>
    </div>

    <div class="card hide" id="stepSlots">
      <h2>2. 希望する時間を選ぶ</h2>
      <div id="slotInfo"></div>
      <div id="slotList"></div>
      <button class="ghost" onclick="backToId()">入力しなおす</button>
    </div>

    <div class="card hide" id="stepConfirm">
      <h2>3. 確認して予約</h2>
      <div id="confirmErr"></div>
      <dl class="kv" id="confirmKv"></dl>
      <label for="guardian">保護者氏名（任意）</label>
      <input id="guardian" type="text" placeholder="例: 長崎 花子">
      <label for="note">担任に伝えたいこと（任意）</label>
      <textarea id="note" placeholder="相談したい内容などがあればご記入ください"></textarea>
      <button class="primary" id="btnBook" onclick="doBook()">この時間で予約する</button>
      <button class="ghost" onclick="backToSlots()">時間を選びなおす</button>
    </div>

    <div class="card hide" id="stepDone">
      <h2>予約が完了しました</h2>
      <dl class="kv" id="doneKv"></dl>
      <p style="margin:16px 0 0;font-size:.92rem;">変更・取消に必要な<strong>予約コード</strong>です。必ず控えてください。</p>
      <div class="code" id="doneCode"></div>
      <button class="ghost" onclick="window.print()">この画面を印刷する</button>
    </div>
  </div>

  <!-- ========== 確認・変更・取消 ========== -->
  <div id="paneManage" class="hide">
    <div class="card" id="mStepId">
      <h2>予約の確認・変更・取消</h2>
      <div id="mErr"></div>
      <label for="mCls">クラス</label>
      <select id="mCls"></select>
      <label for="mNo">出席番号</label>
      <input id="mNo" type="number" inputmode="numeric" min="1">
      <label for="mName">生徒氏名</label>
      <input id="mName" type="text">
      <label for="mCode">予約コード（4桁）</label>
      <input id="mCode" type="text" inputmode="numeric" maxlength="4" placeholder="0000">
      <button class="primary" id="btnLookup" onclick="doLookup()">予約を表示する</button>
    </div>

    <div class="card hide" id="mStepView">
      <h2>現在のご予約</h2>
      <div id="mViewMsg"></div>
      <dl class="kv" id="mKv"></dl>
      <button class="ghost" onclick="startChange()">時間を変更する</button>
      <button class="ghost danger" onclick="doCancel()">予約を取り消す</button>
      <button class="ghost" onclick="mBack()">閉じる</button>
    </div>

    <div class="card hide" id="mStepSlots">
      <h2>変更先の時間を選ぶ</h2>
      <div id="mSlotErr"></div>
      <div id="mSlotList"></div>
      <button class="ghost" onclick="mBackToView()">やめる</button>
    </div>
  </div>
</div>

<script>
  var CFG = null;
  var student = null;      // {cls,no,name}
  var selectedSlot = null; // {slotId,label}
  var mBooking = null;
  var mCred = null;

  function call(fn, arg) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { r && r.ok ? resolve(r) : reject(new Error((r && r.error) || '通信に失敗しました。')); })
        .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : '通信に失敗しました。')); })
        [fn](arg);
    });
  }
  function el(id) { return document.getElementById(id); }
  function show(id, on) { el(id).classList.toggle('hide', !on); }
  function msg(id, text, kind) {
    el(id).innerHTML = text ? '<div class="msg ' + (kind || 'err') + '">' + esc(text) + '</div>' : '';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function busy(id, on, label) {
    var b = el(id);
    b.disabled = on;
    if (on) { b.dataset.label = b.textContent; b.textContent = '処理中…'; }
    else { b.textContent = label || b.dataset.label || b.textContent; }
  }

  call('apiInit').then(function (r) {
    CFG = r;
    document.title = r.title;
    el('title').textContent = r.title;
    el('notice').textContent = r.notice;
    ['cls', 'mCls'].forEach(function (id) {
      var s = el(id);
      s.innerHTML = '<option value="">選んでください</option>' +
        r.classes.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    });
    if (!r.open) {
      el('closed').textContent = r.message;
      show('closed', true);
      el('btnFind').disabled = true;
      el('btnLookup').disabled = true;
    }
    if (!r.checkName) {
      el('name').placeholder = '（省略できます）';
      el('mName').placeholder = '（省略できます）';
    }
  }).catch(function (e) {
    el('title').textContent = '読み込みに失敗しました';
    el('notice').textContent = e.message;
  });

  function showTab(which) {
    el('tabBook').classList.toggle('on', which === 'book');
    el('tabManage').classList.toggle('on', which === 'manage');
    show('paneBook', which === 'book');
    show('paneManage', which === 'manage');
  }

  /* ---------- 予約する ---------- */

  function findSlots() {
    var p = { cls: el('cls').value, no: el('no').value, name: el('name').value };
    msg('idErr', '');
    busy('btnFind', true);
    call('apiSlots', p).then(function (r) {
      busy('btnFind', false, '空いている時間を見る');
      student = r.student;
      if (r.existing) {
        msg('slotInfo',
          r.student.name + 'さんは、すでに ' + r.existing.dateLabel + ' ' + r.existing.start +
          '〜' + r.existing.end + ' で予約が入っています。\n時間を変えるときは「確認・変更・取消」タブから手続きしてください。', 'warn');
      } else {
        msg('slotInfo', r.student.cls + '　' + r.student.no + '番　' + r.student.name + 'さん' +
          (r.teacher ? '（担任: ' + r.teacher + '）' : '') + '\n緑色の時間から1つ選んでください。', 'ok');
      }
      renderSlots(el('slotList'), r.days, !r.existing, pickSlot);
      show('stepId', false); show('stepSlots', true); show('stepConfirm', false); show('stepDone', false);
      window.scrollTo(0, 0);
    }).catch(function (e) {
      busy('btnFind', false, '空いている時間を見る');
      msg('idErr', e.message);
    });
  }

  function renderSlots(container, days, clickable, onPick) {
    if (!days || !days.length) {
      container.innerHTML = '<div class="msg warn">現在選択できる面談枠が登録されていません。<br>（スプレッドシートのメニュー「三者面談 ▸ ② 枠を再生成」を実行して枠を作成してください）</div>';
      return;
    }
    container.innerHTML = days.map(function (d, di) {
      return '<div class="day"><h3>' + esc(d.dateLabel) + '</h3><div class="slots">' +
        d.slots.map(function (s, si) {
          var cls = 'slot' + (s.mine ? ' mine' : (s.available ? '' : ' full'));
          var attr = (clickable && s.available)
            ? ' data-id="' + esc(s.slotId) + '" data-label="' + esc(d.dateLabel + ' ' + s.start + '〜' + s.end) + '"'
            : '';
          var tail = s.mine ? '<br>ご予約' : (s.available ? '' : '<br>×');
          return '<div class="' + cls + '" id="s_' + di + '_' + si + '"' + attr + '>' +
            esc(s.start + '〜' + s.end) + tail + '</div>';
        }).join('') + '</div></div>';
    }).join('');
    if (clickable) {
      Array.prototype.forEach.call(container.querySelectorAll('.slot[data-id]'), function (node) {
        node.addEventListener('click', function () {
          Array.prototype.forEach.call(container.querySelectorAll('.slot'), function (n) { n.classList.remove('sel'); });
          node.classList.add('sel');
          onPick({ slotId: node.dataset.id, label: node.dataset.label });
        });
      });
    }
  }

  function pickSlot(s) {
    selectedSlot = s;
    el('confirmKv').innerHTML =
      row('クラス', student.cls) + row('生徒', student.no + '番　' + student.name) + row('日時', s.label);
    msg('confirmErr', '');
    show('stepConfirm', true);
    el('stepConfirm').scrollIntoView({ behavior: 'smooth' });
  }

  function row(k, v) { return '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>'; }

  function doBook() {
    if (!selectedSlot) return;
    msg('confirmErr', '');
    busy('btnBook', true);
    call('apiBook', {
      cls: student.cls, no: student.no, name: student.name,
      slotId: selectedSlot.slotId,
      guardian: el('guardian').value, note: el('note').value
    }).then(function (r) {
      busy('btnBook', false, 'この時間で予約する');
      var b = r.booking;
      el('doneKv').innerHTML =
        row('クラス', b.cls + (b.teacher ? '（担任: ' + b.teacher + '）' : '')) +
        row('生徒', b.name) +
        row('日時', b.dateLabel + ' ' + b.start + '〜' + b.end);
      el('doneCode').textContent = r.code;
      show('stepSlots', false); show('stepConfirm', false); show('stepDone', true);
      window.scrollTo(0, 0);
    }).catch(function (e) {
      busy('btnBook', false, 'この時間で予約する');
      msg('confirmErr', e.message);
    });
  }

  function backToId() {
    show('stepSlots', false); show('stepConfirm', false); show('stepId', true);
  }
  function backToSlots() {
    selectedSlot = null;
    show('stepConfirm', false);
    el('stepSlots').scrollIntoView({ behavior: 'smooth' });
  }

  /* ---------- 確認・変更・取消 ---------- */

  function doLookup() {
    mCred = { cls: el('mCls').value, no: el('mNo').value, name: el('mName').value, code: el('mCode').value };
    msg('mErr', '');
    busy('btnLookup', true);
    call('apiLookup', mCred).then(function (r) {
      busy('btnLookup', false, '予約を表示する');
      renderBooking(r.booking);
      show('mStepId', false); show('mStepView', true); show('mStepSlots', false);
    }).catch(function (e) {
      busy('btnLookup', false, '予約を表示する');
      msg('mErr', e.message);
    });
  }

  function renderBooking(b) {
    mBooking = b;
    el('mKv').innerHTML =
      row('クラス', b.cls + (b.teacher ? '（担任: ' + b.teacher + '）' : '')) +
      row('生徒', b.name) +
      row('日時', b.dateLabel + ' ' + b.start + '〜' + b.end) +
      (b.guardian ? row('保護者', b.guardian) : '') +
      (b.note ? row('連絡事項', b.note) : '');
  }

  function startChange() {
    msg('mSlotErr', '');
    call('apiSlots', mCred).then(function (r) {
      renderSlots(el('mSlotList'), r.days, true, function (s) {
        if (!confirm(s.label + ' に変更します。よろしいですか？')) return;
        call('apiChange', {
          cls: mCred.cls, no: mCred.no, name: mCred.name, code: mCred.code, slotId: s.slotId
        }).then(function (rr) {
          renderBooking(rr.booking);
          msg('mViewMsg', '予約の時間を変更しました。予約コードは変わりません。', 'ok');
          show('mStepSlots', false); show('mStepView', true);
          window.scrollTo(0, 0);
        }).catch(function (e) { msg('mSlotErr', e.message); });
      });
      show('mStepView', false); show('mStepSlots', true);
    }).catch(function (e) { msg('mViewMsg', e.message); });
  }

  function doCancel() {
    if (!confirm('予約を取り消します。よろしいですか？\n取り消すと、この時間は他の方が予約できるようになります。')) return;
    call('apiCancel', mCred).then(function () {
      el('mKv').innerHTML = '';
      msg('mViewMsg', '予約を取り消しました。改めて予約する場合は「予約する」タブからお願いします。', 'ok');
    }).catch(function (e) { msg('mViewMsg', e.message); });
  }

  function mBack() {
    msg('mViewMsg', '');
    show('mStepView', false); show('mStepSlots', false); show('mStepId', true);
  }
  function mBackToView() {
    show('mStepSlots', false); show('mStepView', true);
  }
</script>
