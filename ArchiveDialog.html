<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 15px; color: #333; background-color: #f8f9fa; }
      .container { display: flex; flex-direction: column; gap: 15px; }
      .description { font-size: 14px; line-height: 1.5; background: #fff; padding: 10px; border-radius: 6px; border-left: 4px solid #1a73e8; }
      .warning { font-size: 12px; color: #d93025; margin-top: 5px; }
      .date-picker { padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; cursor: pointer; }
      .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
      button { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
      .btn-run { background-color: #1a73e8; color: white; }
      .btn-cancel { background-color: #e8eaed; color: #3c4043; }
      .btn-run:disabled { background-color: #9aa0a6; cursor: not-allowed; }
      #messageBox { font-size: 14px; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="description">
        指定した日付<strong>以前</strong>の過去データをバックアップ用の別ファイルに退避し、現在のシートを軽くします。
        <div class="warning">※「毎日」と設定されている基本ルールは削除されません。</div>
      </div>
      
      <div>
        <label for="targetDate"><strong>📅 対象の基準日を選択:</strong></label>
        <input type="date" id="targetDate" class="date-picker" value="2026-03-31">
      </div>
      
      <div id="messageBox"></div>
      
      <div class="btn-group">
        <button class="btn-cancel" onclick="google.script.host.close()">キャンセル</button>
        <button id="runBtn" class="btn-run" onclick="runArchive()">アーカイブ実行</button>
      </div>
    </div>

    <script>
      function runArchive() {
        const dateVal = document.getElementById('targetDate').value;
        const msgBox = document.getElementById('messageBox');
        const runBtn = document.getElementById('runBtn');

        if (!dateVal) {
          msgBox.style.color = "#d93025";
          msgBox.innerText = "日付を選択してください。";
          return;
        }

        // 実行中のUI表示に変更
        runBtn.disabled = true;
        runBtn.innerText = "⏳ 処理中...";
        msgBox.style.color = "#1a73e8";
        msgBox.innerText = "データを移動しています。この画面を閉じずにお待ちください...";

        // GAS側の処理（executeArchive）を呼び出す
        google.script.run
          .withSuccessHandler(function(result) {
            // 成功したら画面を閉じる
            google.script.host.close();
          })
          .withFailureHandler(function(error) {
            // エラー時の表示
            msgBox.style.color = "#d93025";
            msgBox.innerText = "エラー: " + error.message;
            runBtn.disabled = false;
            runBtn.innerText = "アーカイブ実行";
          })
          .executeArchive(dateVal);
      }
    </script>
  </body>
</html>
